name: Bug report
description: Report reproducible extension behavior using synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal steps without credentials or private profile data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and Chrome version
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys and private profile information.
          required: true
