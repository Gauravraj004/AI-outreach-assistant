<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Outreach Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">✦</span>
        <h1>Outreach<span>AI</span></h1>
      </div>
      <button id="settings-toggle" class="btn-icon" type="button" aria-label="Open settings" title="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1z"></path></svg>
      </button>
    </header>

    <section id="settings-pane" class="settings-pane hidden" aria-label="Settings">
      <h3>Local settings</h3>
      <p class="settings-desc">Saved only in Chrome extension storage. Create a key in <a href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Google AI Studio</a>.</p>
      <div class="input-group">
        <label for="api-key">Gemini API key</label>
        <input id="api-key" type="password" autocomplete="off" placeholder="Paste your Gemini API key">
      </div>
      <div class="input-group">
        <label for="model-name">Gemini model</label>
        <input id="model-name" type="text" value="gemini-3.1-flash-lite">
      </div>
      <div class="input-group">
        <label for="sender-name">Your name</label>
        <input id="sender-name" type="text" placeholder="e.g. Alex Morgan">
      </div>
      <div class="input-group">
        <label for="sender-context">Your background and outreach goal</label>
        <textarea id="sender-context" placeholder="Summarize your experience, strengths, proof points, and what you are seeking."></textarea>
      </div>
      <button id="save-settings" class="btn-primary btn-sm" type="button">Save settings</button>
    </section>

    <div id="status-bar" class="status-bar neutral">
      <span class="status-indicator"></span>
      <span id="status-text">Detecting active page...</span>
    </div>

    <main class="main-content">
      <div class="form-row">
        <div class="input-group full-width">
          <label>Message objective</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="objective" value="direct_message" checked>
              <span class="custom-radio"></span>
              Direct message / InMail
            </label>
            <label class="radio-label">
              <input type="radio" name="objective" value="connection">
              <span class="custom-radio"></span>
              Connection note
            </label>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label for="custom-notes">Custom instructions (optional)</label>
        <textarea id="custom-notes" placeholder="Mention a shared interest, recent post, or specific reason for reaching out."></textarea>
      </div>

      <button id="generate-btn" class="btn-action" type="button" disabled>
        <span class="btn-text">Generate outreach draft</span>
        <span class="loader hidden"></span>
      </button>

      <div id="error-message" class="error-box hidden" role="alert"></div>

      <section id="results-panel" class="results-panel hidden">
        <div class="panel-header">
          <div class="header-left">
            <h4>Generated message</h4>
            <div id="tech-badge" class="focus-badge hidden">
              <span class="badge-dot"></span>
              <span id="badge-text" class="badge-text"></span>
            </div>
          </div>
          <span id="char-counter" class="char-counter">0 chars</span>
        </div>
        <div class="textarea-container">
          <textarea id="output-text" placeholder="Review and edit the draft before sending."></textarea>
        </div>
        <div class="button-row">
          <button id="copy-btn" class="btn-secondary" type="button">Copy message</button>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span>Drafts only · Review before sending</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
